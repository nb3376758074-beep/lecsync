<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<title>LecSync · 录音 · 转录 · 纪要</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<meta name="description" content="LecSync 网页版：实时转录、双语字幕、AI 纪要，全部功能免费解锁。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LecSync">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  /* first paint */
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:999;transition:opacity .25s}
  #boot .m{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--text)}
  #boot .w{width:76px;height:76px;border-radius:22px;background:#000;display:grid;place-items:center;color:#fff;
    box-shadow:0 10px 30px rgba(0,0,0,.18)}
  #boot .t{font-size:15px;font-weight:640;letter-spacing:-.01em}
  #boot .s{font-size:11.5px;color:var(--text-3)}
  @media (prefers-color-scheme:dark){#boot .w{background:#f4f4f5;color:#0a0a0b}}
</style>
</head>
<body>
<div id="boot">
  <div class="m">
    <div class="w">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M5 33c6-2 8-11 12-11s6 9 10 9 6-13 10-13 6 4 8 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M7 22c5-1.5 7-8 10-8s6 6 9 6 6-9 9-9 5 3 7 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".45"/>
      </svg>
    </div>
    <div class="t">LecSync</div>
    <div class="s">录音 · 转录 · 纪要</div>
  </div>
</div>
<div id="app"></div>
<noscript style="padding:24px;display:block;font-family:system-ui">这个网页需要 JavaScript。</noscript>
<script type="module">
  import { boot } from './assets/js/app.js?v=1.5.1';
  if (new URLSearchParams(location.search).get('demo') === '1') {
    await import('./assets/js/demo.js');
  }
  if (new URLSearchParams(location.search).has('noboot')) document.getElementById('boot')?.remove();
  const go = () => requestAnimationFrame(() => {
    boot();
    const b = document.getElementById('boot');
    if (b) { b.style.opacity = '0'; setTimeout(() => b.remove(), 260); }
  });
  // wait for fonts/layout stability on iOS
  if (document.readyState === 'complete') go();
  else window.addEventListener('load', go, { once: true });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=1.5.1').catch(() => {});
    });
  }
</script>
</body>
</html>
