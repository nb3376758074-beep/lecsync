<script>
  // 鍙仛涓や欢浜嬶細鈶?娓呮帀鍘嗗彶閬楃暀鐨?Service Worker/缂撳瓨锛堝箓绛夛級
  // 鈶?濡傛灉 15 绉掑悗妯″潡鑴氭湰杩?寮€濮嬫墽琛?閮芥病鍙戠敓锛屾墠鎻愮ず锛屽苟缁欐墜鍔ㄦ寜閽?  // 涓ョ鑷姩 reload 鈥斺€?鎱㈢綉涓嬪弽澶嶉噸杞戒細鎶婁笅杞芥案杩滄墦鏂紙杩欐槸涔嬪墠鐧藉睆鐨勭湡鍥狅級
  (function () {
    function booted() { return !!(document.querySelector('.tabbar') || document.querySelector('#view .rec-title')); }
    function reload() { location.replace(location.pathname + '?v=' + Date.now()); }
    function clean() {
      var jobs = [];
      if ('serviceWorker' in navigator) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
      return Promise.all(jobs).catch(function () {});
    }
    clean();

    function showFallback() {
      if (booted() || document.getElementById('lcs-err')) return;
      var d = document.createElement('div');
      d.id = 'lcs-err';
      d.style.cssText = 'position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:24px;background:#fff;color:#111;font:15px/1.6 system-ui,-apple-system,sans-serif;text-align:center';
      d.innerHTML = '<div style="max-width:340px">'
        + '<div style="font-size:17px;font-weight:700;margin-bottom:8px">鍔犺浇鏈夌偣鎱?/div>'
        + '<div style="color:#666;font-size:13px;margin-bottom:16px">鑴氭湰杩樻病涓嬭浇瀹岋紝澶氬崐鏄綉缁滄參銆傚彲浠ュ厛绛変竴涓嬶紝鎴栫偣涓嬮潰鎸夐挳閲嶈瘯銆?/div>'
        + '<button id="lcs-retry" style="width:100%;padding:12px;border:0;border-radius:12px;background:#111;color:#fff;font-size:15px;font-weight:600;margin-bottom:10px">閲嶈瘯</button>'
        + '<button id="lcs-clean" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;color:#111;font-size:15px">娓呯悊缂撳瓨骞堕噸璇?/button>'
        + '<div style="color:#999;font-size:11px;margin-top:14px">鐨撴湀缈昏瘧 v' + (document.documentElement.dataset.ver || '') + '</div></div>';
      document.body.appendChild(d);
      document.getElementById('lcs-retry').onclick = function () { location.replace(location.pathname + '?v=' + Date.now()); };
      document.getElementById('lcs-clean').onclick = function () { clean().then(reload, reload); };
    }

    setTimeout(function () {
      if (booted() || window.__lcsStarted) return; // 妯″潡宸插紑濮嬫墽琛?鈫?缁х画绛夛紝鍒墦鎵?      showFallback();
    }, 15000);
  })();
</script>
<script type="module">
  window.__lcsStarted = true; // 鍛婅瘔鍏滃簳鑴氭湰锛氭ā鍧楀凡缁忓紑濮嬫墽琛岋紝鍒啀寮规彁绀?  import { boot } from './assets/js/app.js?v=2.8.0';
  if (new URLSearchParams(location.search).get('demo') === '1') {
    await import('./assets/js/demo.js');
  }
  if (new URLSearchParams(location.search).has('noboot')) document.getElementById('boot')?.remove();
  const go = () => requestAnimationFrame(() => {
    boot();
    const b = document.getElementById('boot');
    if (b) { b.style.opacity = '0'; setTimeout(() => b.remove(), 260); }
  });
  // wait for fonts/layout stability on iOS
  if (document.readyState === 'complete') go();
  else window.addEventListener('load', go, { once: true });
</script>
