<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<title>皓月翻译 · 录音 · 转录 · 纪要</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<meta name="description" content="皓月翻译 网页版：实时转录、双语字幕、AI 纪要，全部功能免费解锁。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="皓月翻译">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  /* first paint */
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:999;transition:opacity .25s}
  #boot .m{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--text)}
  #boot .w{width:76px;height:76px;border-radius:22px;background:#000;display:grid;place-items:center;color:#fff;
    box-shadow:0 10px 30px rgba(0,0,0,.18)}
  #boot .t{font-size:15px;font-weight:640;letter-spacing:-.01em}
  #boot .s{font-size:11.5px;color:var(--text-3)}
  @media (prefers-color-scheme:dark){#boot .w{background:#f4f4f5;color:#0a0a0b}}
</style>
</head>
<body>
<div id="boot">
  <div class="m">
    <img src="logo.png" width="96" height="96" alt="皓月翻译" style="border-radius:22px">
    <div class="t">皓月翻译</div>
    <div class="s">录音 · 转录 · 纪要</div>
  </div>
</div>
<div id="app"></div>
<noscript style="padding:24px;display:block;font-family:system-ui">这个网页需要 JavaScript。</noscript>
<script>
  // 自愈：每次打开都先卸掉旧 Service Worker + 清缓存；3 秒还没进应用就带新参数重载一次
  (function () {
    var FIX = 'lcs.selfheal.v3';
    function booted() { return !!(document.querySelector('.tabbar') || document.querySelector('#view .rec-title')); }
    function reload() { location.replace(location.pathname + '?v=' + Date.now()); }
    function clean() {
      var jobs = [];
      if ('serviceWorker' in navigator) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
      return Promise.all(jobs);
    }
    clean().then(function () {}, function () {});
    setTimeout(function () {
      if (booted()) return;
      if (sessionStorage.getItem(FIX) === '1') return;
      sessionStorage.setItem(FIX, '1');
      clean().then(reload, reload);
    }, 3000);
  })();
</script>
<script type="module">
  import { boot } from './assets/js/app.js?v=2.2.1';
  if (new URLSearchParams(location.search).get('demo') === '1') {
    await import('./assets/js/demo.js');
  }
  if (new URLSearchParams(location.search).has('noboot')) document.getElementById('boot')?.remove();
  const go = () => requestAnimationFrame(() => {
    boot();
    const b = document.getElementById('boot');
    if (b) { b.style.opacity = '0'; setTimeout(() => b.remove(), 260); }
  });
  // wait for fonts/layout stability on iOS
  if (document.readyState === 'complete') go();
  else window.addEventListener('load', go, { once: true });
</script>
</body>
</html>
